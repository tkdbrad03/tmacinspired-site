<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Room | Admin</title>
  <style>
    :root {
      --pine: #1f4236;
      --gold: #c9a961;
      --cream: #fdfaf5;
      --font-serif: Georgia, 'Times New Roman', Times, serif;
    }
    body {
      background: var(--cream);
      font-family: var(--font-serif);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
    }
    .card {
      background: white;
      padding: 3rem;
      border: 1px solid rgba(31,66,54,0.1);
      max-width: 560px;
      width: 100%;
    }
    .label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--gold);
      margin-bottom: 1rem;
      display: block;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 400;
      color: var(--pine);
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.9rem;
      color: #5c6b64;
      font-style: italic;
      margin-bottom: 2rem;
      line-height: 1.7;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      border: 1px solid rgba(31,66,54,0.15);
      padding: 1rem;
      font-family: var(--font-serif);
      font-size: 1rem;
      color: var(--pine);
      background: var(--cream);
      resize: none;
      outline: none;
      box-sizing: border-box;
      line-height: 1.7;
    }
    textarea:focus { border-color: var(--gold); }
    button {
      margin-top: 1.25rem;
      padding: 0.9rem 2rem;
      background: var(--pine);
      color: white;
      border: none;
      font-family: var(--font-serif);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #152e25; }
    .success {
      display: none;
      margin-top: 1rem;
      font-size: 0.85rem;
      font-style: italic;
      color: var(--gold);
      text-align: center;
    }
    .current {
      margin-top: 2rem;
      padding: 1.25rem;
      border-left: 2px solid var(--gold);
      background: var(--cream);
    }
    .current-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--gold);
      margin-bottom: 0.5rem;
      display: block;
    }
    .current-text {
      font-size: 0.95rem;
      font-style: italic;
      color: #5c6b64;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="label">The Room &nbsp; · &nbsp; Admin</span>
    <h1>Currently Thinking About</h1>
    <p>Type your thought below. It will appear in The Room instantly for all approved members.</p>

    <div class="current" id="currentDisplay" style="display:none;">
      <span class="current-label">Showing now in The Room</span>
      <p class="current-text" id="currentDisplayText"></p>
    </div>

    <textarea id="thoughtInput" placeholder="Type your current thought here..."></textarea>
    <button id="saveBtn">Update The Room</button>
    <p class="success" id="successMsg">The Room has been updated.</p>
    <div style="margin-top:3rem;">
      <span class="label">Women Waiting at the Door</span>
      <div id="requestsList" style="margin-top:1rem;"></div>
    </div>
  </div>

  <script type="module">
    const password = prompt("Enter admin password:");
if (password !== "1904") {
  document.body.innerHTML = "<p style='font-family:Georgia;text-align:center;margin-top:4rem;color:#5c6b64;font-style:italic;'>Access denied.</p>";
  throw new Error("Unauthorized");
}
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCRt8Z9sg5mx1oaltmxBRrsawJamYQmvCA",
      authDomain: "tmac-inspired-room.firebaseapp.com",
      projectId: "tmac-inspired-room",
      storageBucket: "tmac-inspired-room.firebasestorage.app",
      messagingSenderId: "748020064263",
      appId: "1:748020064263:web:ed15bf8c0ed761007e0aa2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Load current thought
    const thoughtRef = doc(db, "settings", "currentThought");
    const thoughtSnap = await getDoc(thoughtRef);
    if (thoughtSnap.exists() && thoughtSnap.data().text) {
      const current = thoughtSnap.data().text;
      document.getElementById("currentDisplayText").textContent = current;
      document.getElementById("currentDisplay").style.display = "block";
      document.getElementById("thoughtInput").value = current;
    }

    // Save new thought
    document.getElementById("saveBtn").addEventListener("click", async () => {
      const text = document.getElementById("thoughtInput").value.trim();
      if (!text) return;

      await setDoc(thoughtRef, { text });

      document.getElementById("currentDisplayText").textContent = text;
      document.getElementById("currentDisplay").style.display = "block";
      document.getElementById("successMsg").style.display = "block";

      setTimeout(() => {
        document.getElementById("successMsg").style.display = "none";
      }, 3000);
    });
   // Load access requests
const requestsRef = collection(db, "accessRequests");
const requestsSnap = await getDocs(query(requestsRef, orderBy("requestedAt", "desc")));
const list = document.getElementById("requestsList");

if (requestsSnap.empty) {
  list.innerHTML = `<p style="font-style:italic; color:#5c6b64; font-size:0.9rem;">No requests yet.</p>`;
} else {
  requestsSnap.forEach((docSnap) => {
    const r = docSnap.data();
    const div = document.createElement("div");
    div.style.cssText = "padding:1rem 0; border-bottom:1px solid rgba(31,66,54,0.08); display:flex; justify-content:space-between; align-items:center;";
    div.innerHTML = `
      <div>
        <div style="font-size:0.9rem; color:#1f4236;">${r.name}</div>
        <div style="font-size:0.75rem; color:#5c6b64; font-style:italic;">${r.email}</div>
      </div>
      <button onclick="approveUser('${r.email}', '${r.name}')"
        style="padding:0.5rem 1.25rem; background:#1f4236; color:white; border:none; font-family:Georgia,serif; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.15em; cursor:pointer;">
        Let Her In
      </button>`;
    list.appendChild(div);
  });
}

window.approveUser = async (email, name) => {
  await setDoc(doc(db, "approvedUsers", email), {
    approved: true,
    name: name,
    approvedAt: new Date().toISOString()
  });

  // Send welcome email via no-cors fetch
  fetch("https://script.google.com/macros/s/AKfycbztgahI-wqrsb60am6DIIXf_9iVdx4nhN_t47cyiwmeBMhHeJ1K_8aUqa_tl33Oy1RiJA/exec?action=welcome&email=" +
    encodeURIComponent(email) + "&name=" + encodeURIComponent(name), {
    mode: "no-cors",
    cache: "no-store"
  });

  alert(name + " has been welcomed into The Room.");
  location.reload();
};
  </script>
</body>
</html>
