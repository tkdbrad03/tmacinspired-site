<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Skins Tracker</title>
<link rel="icon" type="image/png" href="golf-skins.png">
<link rel="apple-touch-icon" href="golf-skins.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Golf Skins">
<meta name="theme-color" content="#ffffff">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ffffff;
    color: #1a2f1c;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 16px 12px 40px;
  }
  h1 { font-weight: 700; font-size: 2rem; color: #c9a86c; letter-spacing: 2px; text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; font-size: 0.75rem; color: #5a7a5a; margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
  .room-bar { text-align: center; font-size: 0.75rem; color: #5a7a5a; margin-bottom: 4px; }
  .room-bar span { color: #c9a86c; font-weight: 600; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5a7a5a; margin-right: 5px; vertical-align: middle; transition: background 0.3s; }
  .status-dot.connected { background: #4caf50; }
  .status-line { text-align: center; font-size: 0.7rem; color: #5a7a5a; margin-bottom: 12px; }

.setup-bar {
display: flex; align-items: center; justify-content: center;
gap: 12px; background: #f4f7f4; border: 1px solid #c8dac8;
border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; flex-wrap: wrap;
}
.setup-bar label { font-size: 0.7rem; color: #5a7a5a; text-transform: uppercase; letter-spacing: 1px; }
.setup-bar select, .setup-bar input[type=“number”] {
background: #ffffff; border: 1px solid #c8dac8; border-radius: 6px;
color: #1a2f1c; font-family: ‘DM Sans’, sans-serif; font-size: 0.9rem; padding: 4px 8px; outline: none;
}
.setup-bar input[type=“number”] { width: 60px; }
.setup-bar select:focus, .setup-bar input:focus { border-color: #c9a86c; }
.par3-setup { background: #f4f7f4; border: 1px solid #c8dac8; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
.par3-setup label { font-size: 0.7rem; color: #5a7a5a; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 8px; }
.par3-holes { display: flex; flex-wrap: wrap; gap: 6px; }
.par3-btn { background: #ffffff; border: 1px solid #c8dac8; border-radius: 6px; padding: 4px 8px; font-size: 0.8rem; font-family: 'DM Sans', sans-serif; cursor: pointer; color: #1a2f1c; transition: all 0.2s; }
.par3-btn.selected { background: #1a2f1c; color: #c9a86c; border-color: #1a2f1c; }
.ctp-cell { font-size: 0.65rem; color: #c9a86c; font-weight: 600; cursor: pointer; }
.ctp-winner { color: #2e7d32; font-weight: 700; }

.players { display: grid; gap: 8px; margin-bottom: 14px; }
.players.p2 { grid-template-columns: repeat(2, 1fr); }
.players.p3 { grid-template-columns: repeat(3, 1fr); }
.players.p4 { grid-template-columns: repeat(2, 1fr); }

.player-card { background: #f4f7f4; border: 1px solid #c8dac8; border-radius: 10px; padding: 10px 8px; text-align: center; }
.player-card label { display: block; font-size: 0.6rem; color: #5a7a5a; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
.player-card input[type=“text”] {
width: 100%; background: transparent; border: none; border-bottom: 1px solid #c9a86c;
color: #1a2f1c; font-family: ‘DM Sans’, sans-serif; font-weight: 700;
font-size: 1rem; text-align: center; outline: none; padding: 2px 0;
}
.winnings { font-size: 1.2rem; font-weight: 700; margin-top: 5px; }
.skins-count { font-size: 0.65rem; color: #5a7a5a; margin-top: 2px; }
.pos { color: #2e7d32; }
.neg { color: #c62828; }
.zero { color: #5a7a5a; }

.table-wrap { overflow-x: auto; margin-bottom: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 280px; }
thead th {
background: #f4f7f4; padding: 8px 4px; text-align: center;
font-weight: 700; font-size: 0.85rem; color: #c9a86c; border-bottom: 2px solid #c8dac8;
}
thead th:first-child { text-align: left; padding-left: 8px; min-width: 60px; }
tbody tr { border-bottom: 1px solid #e8f0e8; }
tbody tr:hover { background: #f0f5f0; }
td { padding: 5px 3px; text-align: center; vertical-align: middle; }
td:first-child { font-weight: 700; font-size: 0.85rem; color: #c9a86c; padding-left: 8px; text-align: left; white-space: nowrap; }
.score-input {
width: 38px; background: #ffffff; border: 1px solid #c8dac8; border-radius: 6px;
color: #1a2f1c; font-size: 0.95rem; text-align: center; padding: 4px 2px;
font-family: ‘DM Sans’, sans-serif; outline: none; transition: border-color 0.2s;
}
.score-input:focus { border-color: #c9a86c; }
.result-cell { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; min-width: 52px; }
.win-cell { color: #2e7d32; }
.push-cell { color: #5a7a5a; }
.totals-row td { background: #f4f7f4; font-weight: 700; padding: 8px 3px; font-size: 1rem; }
.totals-row td:first-child { color: #c9a86c; padding-left: 8px; }

.btn-row { display: flex; gap: 10px; justify-content: center; }
button {
background: #c9a86c; color: #ffffff; border: none; border-radius: 8px;
padding: 10px 22px; font-family: ‘DM Sans’, sans-serif; font-weight: 700;
font-size: 1rem; cursor: pointer; transition: background 0.2s;
}
button:hover { background: #b8964f; }
button.secondary { background: transparent; border: 1px solid #c8dac8; color: #5a7a5a; }
button.secondary:hover { border-color: #c9a86c; color: #c9a86c; }
.note { text-align: center; font-size: 0.7rem; color: #5a7a5a; margin-top: 14px; font-style: italic; }
.viewer-badge { text-align: center; background: #f4f7f4; border: 1px solid #c8dac8; border-radius: 20px; padding: 6px 16px; font-size: 0.75rem; color: #5a7a5a; display: inline-block; }
.viewer-wrap { text-align: center; margin-bottom: 12px; }
.share-btn { background: #1a2f1c; color: #c9a86c; font-size: 0.85rem; padding: 8px 18px; border-radius: 8px; border: none; font-family: 'DM Sans', sans-serif; font-weight: 700; cursor: pointer; margin-top: 10px; }
.copied-msg { font-size: 0.7rem; color: #2e7d32; text-align: center; margin-top: 6px; display: none; }
</style>

</head>
<body>

<h1>Golf Skins</h1>
<p class="subtitle">Outright win = skin · Tie = no one gets it</p>
<div class="room-bar">Room: <span id="roomLabel">—</span></div>
<div class="status-line"><span class="status-dot" id="dot"></span><span id="statusText">Connecting…</span></div>

<div class="setup-bar">
  <label>Holes</label>
  <select id="numHoles" onchange="changeSetup()">
    <option value="front">Front 9</option>
    <option value="back">Back 9</option>
    <option value="18" selected>All 18</option>
  </select>
  <label>Players</label>
  <select id="numPlayers" onchange="changeSetup()">
    <option value="2">2 Players</option>
    <option value="3" selected>3 Players</option>
    <option value="4">4 Players</option>
  </select>
  <label>Buy-In $</label>
<input type="number" id="betAmount" value="20" min="1" max="500" step="1" oninput="changeSetup()">
</div>
<div class="par3-setup" id="par3Setup">
  <label>📍 Select Par 3 Holes (CTP)</label>
  <div class="par3-holes" id="par3Holes"></div>
</div>


<div class="players p3" id="playerCards"></div>

<div class="table-wrap">
  <table>
    <thead><tr id="tableHeader"></tr></thead>
    <tbody id="tbody"></tbody>
    <tfoot><tr class="totals-row" id="totalsRow"></tr></tfoot>
  </table>
</div>

<div class="btn-row" id="adminControls">
  <button onclick="calculate()">Calculate</button>
  <button class="secondary" onclick="resetAll()">Reset</button>
</div>
<div style="text-align:center">
  <button class="share-btn" onclick="shareLeaderboard()">📤 Share Leaderboard</button>
  <div class="copied-msg" id="copiedMsg">Link copied to clipboard!</div>
</div>
<div class="viewer-wrap" id="viewerBadge" style="display:none">
  <span class="viewer-badge">Leaderboard View — Live Updates</span>
</div>
<p class="note" id="adminNote">Ties are a push — no skin awarded.</p>


<script>
let HOLES = 18;
let holeMode = '18'; // 'front', 'back', '18'
let holeNumbers = Array.from({length: 18}, (_,i) => i+1); // actual hole numbers to display
let numPlayers = 3;
let betAmount = 1;
let scores = Array.from({length: 18}, () => Array(4).fill(''));
let names = ['Me', 'Player 2', 'Player 3', 'Player 4'];
let par3Holes = []; // holes marked as par 3 (0-indexed)
let ctpWinners = Array(18).fill(null); // index = hole, value = player index

const params = new URLSearchParams(location.search);

// Handle return from PayPal payment
if (params.get('paid') === '1') {
  const newRoom = 'golf-' + Math.random().toString(36).slice(2, 7);
  params.set('room', newRoom);
  params.delete('paid');
  history.replaceState({}, '', '?' + params.toString());
}

let room = params.get('room');
if (!room) {
  room = 'golf-' + Math.random().toString(36).slice(2, 7);
  params.set('room', room);
  history.replaceState({}, '', '?' + params.toString());
} else {
  room = params.get('room');
}
document.getElementById('roomLabel').textContent = room;

function saveToURL() {
  const state = { n: names.slice(0, numPlayers), s: scores.map(r => r.slice(0, numPlayers)), p: numPlayers, b: betAmount, h: holeMode };
  params.set('data', btoa(JSON.stringify(state)));
  history.replaceState({}, '', '?' + params.toString());
}

function loadFromURL() {
  const data = params.get('data');
  if (!data) return;
  try {
    const state = JSON.parse(atob(data));
    if (state.h) {
      holeMode = state.h;
      document.getElementById('numHoles').value = state.h;
      const { count, start } = getHoleSettings(holeMode);
      HOLES = count;
      holeNumbers = Array.from({length: count}, (_,i) => i + start);
    }
    if (state.p) { numPlayers = state.p; document.getElementById('numPlayers').value = state.p; }
    if (state.b) { betAmount = state.b; document.getElementById('betAmount').value = state.b; }
    if (state.n) state.n.forEach((n,i) => names[i] = n);
    if (state.s) {
      scores = Array.from({length: HOLES}, () => Array(4).fill(''));
      state.s.forEach((row,h) => row.forEach((v,p) => { if (scores[h]) scores[h][p] = v; }));
    }
  } catch(e) { console.log(e); }
}

function getHoleSettings(mode) {
  if (mode === 'front') return { count: 9, start: 1 };
  if (mode === 'back')  return { count: 9, start: 10 };
  return { count: 18, start: 1 };
}

function changeSetup() {
  const newMode = document.getElementById('numHoles').value;
  const newPlayers = parseInt(document.getElementById('numPlayers').value);
  const newBet = parseFloat(document.getElementById('betAmount').value) || 1;
  if (newMode !== holeMode) {
    holeMode = newMode;
    const { count, start } = getHoleSettings(holeMode);
    HOLES = count;
    holeNumbers = Array.from({length: count}, (_,i) => i + start);
    scores = Array.from({length: HOLES}, () => Array(4).fill(''));
  }
  numPlayers = newPlayers;
  betAmount = newBet;
  buildAll();
  broadcastState();
}

function buildAll() {
  buildPlayerCards();
  buildTable();
  buildPar3Selector();
  renderHeaders();
  calculate();
}


function buildPlayerCards() {
  const container = document.getElementById('playerCards');
  container.className = 'players p' + numPlayers;
  container.innerHTML = '';
  for (let i = 0; i < numPlayers; i++) {
    const div = document.createElement('div');
    div.className = 'player-card';
    div.innerHTML = `
      <label>Player ${i+1}</label>
      <input type="text" id="name${i}" value="${names[i]}" oninput="names[${i}]=this.value; broadcastState()">
      <div class="winnings zero" id="win${i}">$0</div>
      <div class="skins-count" id="skins${i}">0 skins</div>`;
    container.appendChild(div);
  }
}

function renderHeaders() {
  const hdr = document.getElementById('tableHeader');
  hdr.innerHTML = '<th>Hole</th>';
  for (let i = 0; i < numPlayers; i++) hdr.innerHTML += `<th id="h${i}">${names[i] || 'P'+(i+1)}</th>`;
  hdr.innerHTML += '<th>Result</th>';

  const tot = document.getElementById('totalsRow');
  tot.innerHTML = '<td>Total</td>';
  for (let i = 0; i < numPlayers; i++) tot.innerHTML += `<td id="tot${i}">—</td>`;
  tot.innerHTML += '<td></td>';
}

function buildTable() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  for (let h = 0; h < HOLES; h++) {
    const tr = document.createElement('tr');
    let cells = `<td>Hole ${holeNumbers[h]}</td>`;
    for (let p = 0; p < numPlayers; p++) {
      cells += `<td><input class="score-input" type="number" min="1" max="15" placeholder="—"
        value="${scores[h] ? scores[h][p] : ''}"
        oninput="scores[${h}][${p}]=this.value; broadcastState();"></td>`;
    }
    const ctpLabel = par3Holes.includes(h) ? `<div class="ctp-cell" onclick="ctpTap(${h})" id="ctp${h}">📍 Tap CTP</div>` : '';
    cells += `<td class="result-cell" id="res${h}">${ctpLabel}</td>`;
    tr.innerHTML = cells;
    tbody.appendChild(tr);
  }
}

function buildPar3Selector() {
  const container = document.getElementById('par3Holes');
  container.innerHTML = '';
  for (let h = 0; h < HOLES; h++) {
    const btn = document.createElement('button');
    btn.className = 'par3-btn' + (par3Holes.includes(h) ? ' selected' : '');
    btn.textContent = holeNumbers[h];
    btn.onclick = () => {
      if (par3Holes.includes(h)) {
        par3Holes = par3Holes.filter(x => x !== h);
        ctpWinners[h] = null;
      } else {
        par3Holes.push(h);
      }
      buildPar3Selector();
      buildTable();
      calculate();
      broadcastState();
    };
    container.appendChild(btn);
  }
}

function ctpTap(h) {
  if (!par3Holes.includes(h)) return;
  const current = ctpWinners[h];
  // cycle through players then back to null
  if (current === null) ctpWinners[h] = 0;
  else if (current < numPlayers - 1) ctpWinners[h] = current + 1;
  else ctpWinners[h] = null;
  calculate();
  broadcastState();
}

function calculate() {
  const skinCounts = Array(numPlayers).fill(0);
  const strokeTotals = Array(numPlayers).fill(0);

  for (let h = 0; h < HOLES; h++) {
    const cell = document.getElementById('res'+h);
    if (!cell) continue;
    const vals = [];
    for (let p = 0; p < numPlayers; p++) vals.push(scores[h][p] === '' ? null : parseInt(scores[h][p]));
    if (vals.filter(v => v !== null).length < numPlayers) { cell.textContent = ''; cell.className = 'result-cell'; continue; }

    vals.forEach((v,i) => strokeTotals[i] += v);
    const min = Math.min(...vals);
    const winners = vals.map((v,i) => v === min ? i : -1).filter(i => i >= 0);

    if (winners.length === 1) {
  skinCounts[winners[0]]++;
  cell.textContent = '🏆 ' + (names[winners[0]] || 'P'+(winners[0]+1));
  cell.className = 'result-cell win-cell';
} else {
  cell.textContent = 'Tie';
  cell.className = 'result-cell push-cell';
}
// CTP bonus skin
if (par3Holes.includes(h) && ctpWinners[h] !== null) {
  skinCounts[ctpWinners[h]]++;
  const ctpEl = document.getElementById('ctp'+h);
  if (ctpEl) {
    ctpEl.textContent = '📍 ' + (names[ctpWinners[h]] || 'P'+(ctpWinners[h]+1));
    ctpEl.className = 'ctp-cell ctp-winner';
  }
} else if (par3Holes.includes(h)) {
  const ctpEl = document.getElementById('ctp'+h);
  if (ctpEl) {
    ctpEl.textContent = '📍 Tap CTP';
    ctpEl.className = 'ctp-cell';
  }
}


    const totalSkins = skinCounts.reduce((a,b) => a+b, 0);
  const totalPot = betAmount * numPlayers;
  for (let i = 0; i < numPlayers; i++) {
    const share = totalSkins > 0 ? (skinCounts[i] / totalSkins) * totalPot : 0;
    const net = share; 

    const el = document.getElementById('win'+i);
    if (!el) continue;
    el.textContent = '$' + net.toFixed(net % 1 === 0 ? 0 : 2);
    el.className = 'winnings ' + (net > 0 ? 'pos' : 'zero');
    document.getElementById('skins'+i).textContent = skinCounts[i] + ' skin' + (skinCounts[i] !== 1 ? 's' : '');
    document.getElementById('tot'+i).textContent = strokeTotals[i] || '—';
    const hdr = document.getElementById('h'+i);
    if (hdr) hdr.textContent = names[i] || 'P'+(i+1);
  }
}

// WebSocket
const WS_URL = 'wss://socketsbay.com/wss/v2/1/demo/';
let ws;

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    document.getElementById('dot').className = 'status-dot connected';
    document.getElementById('statusText').textContent = 'Live — all phones synced';
    send({ type: 'request', room });
  };
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.room !== room) return;
      if (msg.type === 'state') applyState(msg);
      else if (msg.type === 'request') broadcastState();
    } catch {}
  };
  ws.onclose = () => {
    document.getElementById('dot').className = 'status-dot';
    document.getElementById('statusText').textContent = 'Reconnecting…';
    setTimeout(connect, 3000);
  };
  ws.onerror = () => ws.close();
}

function send(data) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(data));
}

function broadcastState() {
  saveToURL();
  calculate();
  send({ type: 'state', room, scores, names: names.slice(0, numPlayers), numPlayers, betAmount, holes: HOLES });
}

function applyState(msg) {
  let rebuild = false;
  if (msg.holes && msg.holes !== HOLES) {
    HOLES = msg.holes;
    document.getElementById('numHoles').value = HOLES;
    scores = Array.from({length: HOLES}, () => Array(4).fill(''));
    rebuild = true;
  }
  if (msg.numPlayers && msg.numPlayers !== numPlayers) {
    numPlayers = msg.numPlayers;
    document.getElementById('numPlayers').value = numPlayers;
    rebuild = true;
  }
  if (msg.betAmount) { betAmount = msg.betAmount; document.getElementById('betAmount').value = betAmount; }
  if (msg.names) msg.names.forEach((n,i) => { names[i] = n; });
  if (msg.scores) msg.scores.forEach((row,h) => row.forEach((v,p) => { if (scores[h]) scores[h][p] = v; }));
  if (rebuild) buildAll();
  else {
    for (let i = 0; i < numPlayers; i++) { const el = document.getElementById('name'+i); if (el) el.value = names[i]; }
    for (let h = 0; h < HOLES; h++) {
      for (let p = 0; p < numPlayers; p++) {
        const inp = document.querySelector(`#tbody tr:nth-child(${h+1}) td:nth-child(${p+2}) input`);
        if (inp && inp !== document.activeElement) inp.value = scores[h][p];
      }
    }
    calculate();
  }
}

function resetAll() {
  scores = Array.from({length: HOLES}, () => Array(4).fill(''));
  params.delete('data');
  history.replaceState({}, '', '?' + params.toString());
  buildAll();
  broadcastState();
}
const isViewer = params.get('view') === '1';

function applyViewerMode() {
  if (!isViewer) return;
  document.getElementById('adminControls').style.display = 'none';
  document.getElementById('adminNote').style.display = 'none';
  document.querySelector('.setup-bar').style.display = 'none';
  document.getElementById('viewerBadge').style.display = 'block';
  document.querySelectorAll('input').forEach(inp => inp.setAttribute('readonly', true));
  document.querySelectorAll('.player-card input[type="text"]').forEach(inp => {
    inp.style.borderBottom = 'none';
    inp.style.pointerEvents = 'none';
  });
}

function shareLeaderboard() {
  const shareParams = new URLSearchParams(params.toString());
  shareParams.set('view', '1');
  shareParams.delete('data');
  const url = location.origin + location.pathname + '?' + shareParams.toString();
  navigator.clipboard.writeText(url).then(() => {
    const msg = document.getElementById('copiedMsg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 3000);
  });
}

loadFromURL();
buildAll();
applyViewerMode();
connect();

</script>

</body>
</html>
