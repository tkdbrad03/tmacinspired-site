.state-body { display: none; padding: 0 18px 18px; border-top: 1px solid var(--border); }

var typeColors = {
  deed: 'background:#e8f0ec;color:#1f4236;',
  lien: 'background:#fdf8ee;color:#8a6b1e;',
  both: 'background:#f0e8f8;color:#6b3fa0;'
};
var typeLabels = { deed: 'Tax Deed', lien: 'Tax Lien', both: 'Lien & Deed' };

function renderStates(filter) {
  var list = document.getElementById('states-list');
  list.innerHTML = '';
  var filtered = stateData.filter(function(s) {
    return s.name.toLowerCase().indexOf(filter.toLowerCase()) > -1;
  });
  if (filtered.length === 0) {
    list.innerHTML = '<div class="no-results">No states match your search.<br>Try a different state name.</div>';
    return;
  }
  filtered.forEach(function(state) {
    var card = document.createElement('div');
    card.className = 'state-card';
    var countiesHtml = state.counties.map(function(c) {
      return '<a class="county-link" href="' + c.url + '" target="_blank" rel="noopener">' + c.name + ' <span class="arrow">↗</span></a>';
    }).join('');
    card.innerHTML =
      '<div class="state-card-header" onclick="toggleState(this)">' +
        '<div class="state-name-wrap">' +
          '<div class="state-name">' + state.name + '</div>' +
          '<span class="state-type-badge" style="' + typeColors[state.type] + '">' + typeLabels[state.type] + '</span>' +
        '</div>' +
        '<span class="chevron">▼</span>' +
      '</div>' +
      '<div class="state-body">' +
        '<p class="state-summary">' + state.summary + '</p>' +
        '<div class="resource-section-title">Key Counties</div>' +
        countiesHtml +
        '<a class="state-link" href="' + state.stateUrl + '" target="_blank" rel="noopener"><span class="link-icon">🏛️</span>' + state.stateLabel + ' ↗</a>' +
        '<div class="tip-note">💡 ' + state.tip + '</div>' +
      '</div>';
    list.appendChild(card);
  });
}

function toggleState(header) {
  var body = header.nextElementSibling;
  var chevron = header.querySelector('.chevron');
  var isOpen = body.classList.contains('open');
  // Close all
  document.querySelectorAll('.state-body.open').forEach(function(b){ b.classList.remove('open'); });
  document.querySelectorAll('.state-card-header.open').forEach(function(h){ h.classList.remove('open'); });
  document.querySelectorAll('.chevron.open').forEach(function(c){ c.classList.remove('open'); });
  if (!isOpen) {
    body.classList.add('open');
    header.classList.add('open');
    chevron.classList.add('open');
  }
}

function filterStates() {
  renderStates(document.getElementById('search').value);
}

renderStates('');
